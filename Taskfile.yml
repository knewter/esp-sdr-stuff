version: '3'

tasks:
  default:
    desc: List available project tasks
    cmds:
      - task --list

  env:check:
    desc: Check the locked development tools and Python imports
    cmds:
      - node --version
      - openspec --version
      - task --version
      - python3 -c 'import numpy, scipy, matplotlib, serial, dbus_next, playwright; print("Python dependencies available")'

  site:deps:
    desc: Prepare writable site dependencies from the Nix package
    run: once
    cmds:
      - python3 scripts/prepare_site_deps.py

  validate:
    desc: Validate every OpenSpec change and accepted spec
    cmds:
      - openspec validate --all --strict --no-interactive

  test:
    desc: Run host tests and RDS checks against the current built site
    cmds:
      - python3 -m unittest discover -s tests
      - python3 tools/RDS_test.py
      - node tests/test_work_markdown_links.mjs
      - task: native:ble:crypto-check

  native:ble:crypto-check:
    desc: Check the exact native AES helper against real Nix mbedTLS PSA (no hardware)
    cmds:
      - nix build .#native-ble-crypto-check --no-link

  site:build:
    desc: Build the committed site and check links, ledger counts and budgets
    cmds:
      - task: site:deps
      - python3 scripts/build_site.py

  site:preview:
    desc: Preview the built site (Ctrl-C to stop)
    cmds:
      - npm run preview --prefix site -- --host 127.0.0.1 --port 4321 --strictPort

  browser:check:
    desc: Start an owned preview, check the browser, and clean up
    cmds:
      - python3 scripts/check_site_browser.py {{.CLI_ARGS}}

  browser:live:
    desc: Check the published GitHub Pages site
    cmds:
      - python3 tests/site_browser.py --url https://knewter.github.io/esp-sdr-stuff/ --output test-results/live-browser

  check:
    desc: Run environment, spec, build, host and browser checks in order
    cmds:
      - task: env:check
      - task: validate
      - task: site:build
      - task: test
      - task: browser:check

  check:pages:
    desc: Run all checks with the production GitHub Pages URL prefix
    cmds:
      - ASTRO_BASE=/esp-sdr-stuff/ SITE_ORIGIN=https://knewter.github.io task check

  pages:status:
    desc: Show recent publication workflow runs
    cmds:
      - gh run list --repo knewter/esp-sdr-stuff --workflow spec-site.yml --limit 5

  firmware:build:
    desc: Build a pinned ESP receiver artifact (explicit paths; no flashing)
    preconditions:
      - sh: test -n "$ESP_SDR_IDF_PROVENANCE"
        msg: Use nix develop .#firmware --command task firmware:build with explicit build arguments
    cmds:
      - python3 tools/build_esp_sdr_uart.py {{.CLI_ARGS}}

  firmware:trial:
    desc: Install or restore ESP firmware with verified manifests and explicit arguments
    cmds:
      - python3 tools/flash_trial.py {{.CLI_ARGS}}

  firmware:register:build:
    desc: Build the isolated register-observation artifact (Nix firmware shell; no hardware)
    preconditions:
      - sh: test -n "$ESP_SDR_IDF_PROVENANCE"
        msg: Use nix develop .#firmware with explicit fresh build/output paths
    cmds:
      - python3 tools/build_esp_register_observation.py {{.CLI_ARGS}}

  register:check:
    desc: Check actual C acquisition/parser output and strict host validation (Nix CI shell; no hardware)
    cmds:
      - python3 -m unittest discover -s tests -p 'test_esp_register*.py'

  register:artifact:check:
    desc: Validate the separate register artifact without opening hardware
    cmds:
      - python3 tools/esp_register_artifact.py {{.CLI_ARGS}}

  register:observe:
    desc: Run the bounded register observation and verify full original restoration (exclusive operator)
    cmds:
      - python3 tools/esp_register_observation.py run {{.CLI_ARGS}}

  register:restore:
    desc: Restore and independently verify the preserved ESP image (exclusive operator)
    cmds:
      - python3 tools/esp_register_observation.py restore {{.CLI_ARGS}}

  register:plot:
    desc: Plot integrity-bound register stages and measured hook cycles (no hardware)
    cmds:
      - python3 tools/plot_register_observation.py {{.CLI_ARGS}}

  demo:esp:
    desc: Run the preserved ESP live spectrum demo and verify restoration
    cmds:
      - python3 tools/demo_esp_sdr.py run {{.CLI_ARGS}}

  demo:esp:restore:
    desc: Restore and independently verify the preserved ESP image
    cmds:
      - python3 tools/demo_esp_sdr.py restore {{.CLI_ARGS}}

  decode:ble-dc-first:
    desc: Paired saved-IQ replay with raw DC removal before unchanged BLE decoding
    cmds:
      - python3 tools/ble_dc_first_replay.py {{.CLI_ARGS}}

  source:ble-bluez:
    desc: Run a finite owned BLE source with BlueZ
    cmds:
      - python3 tools/ble_owned_source.py {{.CLI_ARGS}}

  source:ble-direct:
    desc: Run an explicitly configured owned HCI BLE source
    cmds:
      - python3 tools/ble_direct_hci_source.py {{.CLI_ARGS}}

  source:ble-direct:container:
    desc: Run the Nix BLE source image with scoped HCI capabilities
    cmds:
      - python3 tools/ble_source_container.py {{.CLI_ARGS}}

  decode:ble:
    desc: Decode retained ESP BLE snapshots with explicit settings
    cmds:
      - python3 tools/ble_decode_iq.py {{.CLI_ARGS}}

  capture:failure:test:
    desc: Verify private UART failure-prefix retention and closure (no hardware)
    cmds:
      - python3 -B -m unittest discover -s tests -p test_capture_failure_retention.py

  report:ble:
    desc: Join owned-source timing and retained BLE decode evidence
    cmds:
      - python3 tools/ble_trial_report.py {{.CLI_ARGS}}

  capture:esp:
    desc: Capture ESP snapshots using explicit device/settings arguments
    cmds:
      - python3 tools/esp_sdr_capture.py {{.CLI_ARGS}}

  capture:owned-ble:
    desc: Record bounded private ESP I/Q while the owned BLE source runs
    cmds:
      - python3 tools/measure_owned_ble.py {{.CLI_ARGS}}

  capture:rds:
    desc: Run a finite RTL FM/RDS trial using explicit arguments
    cmds:
      - python3 tools/RDS_trial.py {{.CLI_ARGS}}

  capture:ble-monitor:
    desc: Record bounded sanitized Bluetooth monitor metadata
    cmds:
      - python3 tools/ble_dumpcap_monitor.py {{.CLI_ARGS}}

  capture:ble-monitor:container:
    desc: Capture sanitized HCI metadata using the Nix dumpcap image
    cmds:
      - python3 tools/ble_dumpcap_container_monitor.py {{.CLI_ARGS}}

  capture:ble-monitor:test:
    desc: Offline pcap, bounded monitor timers, cancellation and scoped cleanup checks
    cmds:
      - python3 -m unittest discover -s tests -p 'test_ble_dumpcap*.py'

  plot:rds:
    desc: Plot sanitized RDS decoder results
    cmds:
      - python3 tools/RDS_plot.py {{.CLI_ARGS}}

  plot:esp:
    desc: Plot saved ESP snapshot metrics
    cmds:
      - python3 tools/plot_esp_snapshots.py {{.CLI_ARGS}}

  fpga:budget:
    desc: Recompute the FPGA payload and buffer budgets
    cmds:
      - python3 tools/fpga_budget.py {{.CLI_ARGS}}

  native:ble:build:
    desc: Build the separate passive BLE source reference without opening hardware (use nix develop .#firmware)
    preconditions:
      - sh: test -n "$ESP_SDR_IDF_PROVENANCE"
        msg: Use the pinned Nix firmware shell with fresh build and artifact paths
    cmds:
      - python3 tools/build_native_ble_reference.py {{.CLI_ARGS}}

  native:ble:run:
    desc: Run the bounded passive native source reference and verify original-flash restoration (exclusive hardware operator)
    cmds:
      - python3 tools/native_ble_reference.py run {{.CLI_ARGS}}

  native:ble:restore:
    desc: Restore and verify the preserved original image after a native reference trial (exclusive hardware operator)
    cmds:
      - python3 tools/native_ble_reference.py restore {{.CLI_ARGS}}

  forgix:check:
    desc: Check pinned Forgix host tools without opening hardware (use nix develop .#forgix)
    cmds:
      - python3 tools/efinity_bootstrap.py host-check -- {{.CLI_ARGS}}

  forgix:host-check:
    desc: Build the locked Forgix host-tool and upstream protocol checks
    cmds:
      - nix build .#forgix-host-tools --no-link

  forgix:usb-ram:host-test:
    desc: Check strict synthetic USB collector with fixture transports (no hardware)
    cmds:
      - python3 -m unittest discover -v -s tests -p 'test_forgix_usb_ram_capture.py'

  forgix:usb-ram:capture-help:
    desc: Show diagnostic collector arguments (lifecycle must pass inherited exclusive lock FD)
    cmds:
      - python3 tools/forgix_usb_ram_capture.py --help

  forgix:preserve:
    desc: Preserve Forgix MCU flash with explicit identity and fresh backup paths
    cmds:
      - python3 tools/preserve_forgix.py {{.CLI_ARGS}}

  forgix:preserve:container:
    desc: Preserve Forgix using the flake's USB-scoped picotool image
    cmds:
      - python3 scripts/preserve_forgix_container.py {{.CLI_ARGS}}

  forgix:efinity:discover:
    desc: List completed top-level vendor downloads; never opens partials or license contents
    cmds:
      - python3 tools/efinity_bootstrap.py discover {{.CLI_ARGS}}

  forgix:efinity:import:
    desc: Copy explicit full/patch/tool/license inputs into permanent ignored private storage
    cmds:
      - python3 tools/efinity_bootstrap.py import {{.CLI_ARGS}}

  forgix:efinity:install:
    desc: Extract a staged full Linux release privately and select it atomically
    cmds:
      - python3 tools/efinity_bootstrap.py install {{.CLI_ARGS}}

  forgix:efinity:check:
    desc: Check selected vendor CLI in Nix FHS; raw output stays private, no programming
    cmds:
      - python3 tools/efinity_bootstrap.py check

  forgix:efinity:run:
    desc: Run an explicit command in the selected Nix FHS environment with private output
    cmds:
      - python3 tools/efinity_bootstrap.py run -- {{.CLI_ARGS}}

  forgix:efinity:test:
    desc: Offline staging/extraction/version/privacy guards, synthetic inputs only
    cmds:
      - python3 -m unittest discover -s tests -p test_efinity_bootstrap.py

  forgix:efinity:compile-smoke:
    desc: Compile the pinned generic T8F81/C2 software fixture privately; never programs hardware
    cmds:
      - python3 tools/efinity_compile_smoke.py {{.CLI_ARGS}}

  forgix:efinity:compile-smoke:test:
    desc: Synthetic compiler receipt/path/timeout checks; no vendor compiler or hardware
    cmds:
      - python3 -m unittest discover -s tests -p test_efinity_compile_smoke.py

  forgix:usb-ram:build:
    desc: Build and inspect the finite synthetic RP2350 ARM RAM-only USB image; opens no device
    cmds:
      - python3 tools/build_forgix_usb_ram.py {{.CLI_ARGS}}

  forgix:usb-ram:test:
    desc: Test RAM ELF range, vector, metadata and buffer guards without hardware
    cmds:
      - python3 -m unittest discover -s tests -p test_forgix_usb_ram.py

  forgix:usb-ram:trial:
    desc: Run the bounded reviewed RAM-only synthetic USB trial (exclusive hardware operator)
    cmds:
      - python3 tools/forgix_usb_ram_trial.py {{.CLI_ARGS}}

  forgix:usb-ram:recover:
    desc: Verify original factory/flash after operator USB power-cycle (never reload)
    cmds:
      - python3 tools/forgix_usb_ram_trial.py --action recover {{.CLI_ARGS}}

  forgix:usb-ram:trial:test:
    desc: Test RAM lifecycle identity, timeout, cancellation and closure with synthetic fixtures only
    cmds:
      - python3 -m unittest discover -s tests -p test_forgix_usb_ram_trial.py

  forgix:fpga:candidate:
    desc: Compile provisional T8F49/I2 32MHz gateware privately; never programs a device
    cmds:
      - python3 tools/forgix_fpga_candidate.py {{.CLI_ARGS}}

  forgix:fpga:candidate:test:
    desc: Candidate source, output and refusal checks; no hardware or vendor compile
    cmds:
      - python3 -m unittest discover -s tests -p test_forgix_fpga_candidate.py

  forgix:synthetic:source:test:
    desc: Run actual finite-source HDL and generated SPI integration checks (no hardware)
    cmds:
      - python3 -B -m unittest discover -s tests -p test_forgix_synthetic_source.py

  forgix:synthetic:stream:engine:test:
    desc: Replay actual native C stream ownership, source-state and deadline faults (no hardware)
    cmds:
      - python3 -B -m unittest discover -s tests -p test_forgix_stream_engine.py

  forgix:synthetic:stream:build:
    desc: Build a private finite RAM-only RP stream artifact from an exact synthetic FPGA candidate (use .#forgix-spi-bridge); never load
    cmds:
      - python3 tools/build_forgix_synthetic_stream.py {{.CLI_ARGS}}

  forgix:synthetic:stream:build:test:
    desc: Test separate stream adapter, ELF and exact-image guards without ARM compilation or hardware
    cmds:
      - python3 -B -m unittest discover -s tests -p test_forgix_stream_build.py

  forgix:synthetic:source:rtl:
    desc: Generate committed private finite-source RTL (no vendor or hardware)
    cmds:
      - python3 -B tools/forgix_synthetic_gateware.py {{.CLI_ARGS}}

  forgix:synthetic:candidate:test:
    desc: Check fixed offline synthetic compiler inputs and failure gates (no vendor)
    cmds:
      - python3 -B -m unittest discover -s tests -p test_forgix_synthetic_candidate.py

  forgix:synthetic:candidate:compile:
    desc: Compile a private provisional synthetic candidate; never load or program
    cmds:
      - python3 tools/forgix_synthetic_candidate.py compile {{.CLI_ARGS}}

  forgix:synthetic:candidate:runtime:
    desc: Check committed synthetic inputs inside the actual Efinity FHS; no compilation or hardware (use .#forgix)
    cmds:
      - >-
        python3 tools/efinity_bootstrap.py run -- @forgix-python -c
        'import sys,json,os; sys.path.insert(0,"tools"); import forgix_synthetic_candidate as c;
        c.b.require(os.environ.get("FORGIX_INSIDE_EFINITY")=="1","Actual FHS runtime required");
        hashes=c.source_hashes(); print(json.dumps({"committed_input_count":len(hashes),"hardware_opened":False,"compiler_executed":False,"source_sha256":hashes}))'

  forgix:synthetic:codec:test:
    desc: Replay finite source and USB codecs against actual native C with UBSan; no hardware
    cmds:
      - python3 -m unittest discover -s tests -p 'test_forgix_synthetic_codec.py'

  forgix:fpga:guard:test:
    desc: Simulate guarded SPIBone under the explicit RP release contract; no hardware
    cmds:
      - python3 -m unittest discover -s tests -p test_forgix_spi_guard.py

  forgix:spi-bridge:build:
    desc: Build the finite RP PIO register bridge privately; never load or program
    cmds:
      - python3 tools/build_forgix_spi_bridge.py {{.CLI_ARGS}}

  forgix:spi-bridge:test:
    desc: Check real C protocol and PIO/guard simulations without hardware
    cmds:
      - python3 -m unittest discover -s tests -p 'test_forgix_spi_bridge*.py'

  forgix:spi-bridge:plan:
    desc: Generate a finite offline register plan in a fresh private directory
    cmds:
      - python3 tools/forgix_spi_bridge.py {{.CLI_ARGS}}

  forgix:spi-bridge:startup-audit:
    desc: Inspect a saved bridge ELF and pinned SDK reset metadata without hardware
    cmds:
      - python3 tools/audit_forgix_spi_startup.py {{.CLI_ARGS}}

  forgix:spi-bridge:collector:test:
    desc: Test private register persistence and serial closure with injected/PTY transports; no hardware
    cmds:
      - python3 -m unittest discover -v -s tests -p test_forgix_spi_capture.py

  forgix:spi-bridge:lifecycle:test:
    desc: Check offline session ordering and real owned-process cleanup; no devices
    cmds:
      - python3 -m unittest discover -v -s tests -p test_forgix_spi_lifecycle.py

  forgix:spi-bridge:lifecycle:plan:
    desc: Save an offline lifecycle plan privately; no physical backend or load admission
    cmds:
      - python3 tools/forgix_spi_lifecycle.py {{.CLI_ARGS}}

  forgix:spi-bridge:config:test:
    desc: Test actual configuration C with fake SDK and injected host transport; no hardware
    cmds:
      - python3 -m unittest discover -v -s tests -p test_forgix_config.py

  forgix:spi-bridge:backend:test:
    desc: Test identity, exact RAM selection and serial/backend faults offline; no hardware
    cmds:
      - python3 -m unittest discover -v -s tests -p test_forgix_spi_backend.py

  forgix:spi-bridge:backend:plan:
    desc: Save backend preparation plan; empty qualification registry refuses hardware
    cmds:
      - python3 tools/forgix_spi_backend.py {{.CLI_ARGS}}

  forgix:spi-bridge:coordinator:test:
    desc: Test exact committed inputs, exclusive flock and durable episode faults offline
    cmds:
      - python3 -m unittest discover -v -s tests -p test_forgix_spi_coordinator.py

  forgix:spi-bridge:preflight:
    desc: Verify a registry-qualified register profile without opening hardware
    cmds:
      - python3 tools/run_forgix_spi_trial.py preflight {{.CLI_ARGS}}

  forgix:spi-bridge:trial:
    desc: Run one preserved register episode only when its exact qualification tuple is committed
    cmds:
      - python3 tools/run_forgix_spi_trial.py run {{.CLI_ARGS}}
